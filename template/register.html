{% extends 'base.html' %}
{% load static %}
{% block body %}


<!-- Page Header Start -->
    <div class="container-fluid bg-secondary mb-5">
        <div class="d-flex flex-column align-items-center justify-content-center" style="min-height: 100px">
            <h4 class="font-weight-semi-bold text-uppercase mb-3">Register</h4>
            <div class="d-inline-flex">
                <p class="m-0"><a href="">Home</a></p>
                <p class="m-0 px-2">-</p>
                <p class="m-0">Register</p>
            </div>
        </div>
    </div>
    <!-- Page Header End -->

    <!-- Contact Start -->
    <div class="container-fluid pt-5">
        <div class="text-center mb-4">
            
        </div>
        
        <div class="row px-xl-5">
            <div class="col-lg-7 mb-5">
                <div class="contact-form">
                    <div id="success"></div>

                    <h1>Register Here</h1>
                    <form action="/register/" method="post">
                        {% csrf_token %}

                        <div class="form-group">
                            <label class="text-black" for="fname">First Name</label>
                                <input type="text" class="form-control" id="fname" name="fname">
                        </div>
                        <div class="form-group">
                            <label class="text-black" for="lname">Last Name</label>
                                <input type="text" class="form-control" id="lname" name="lname">
                        </div>
                        <div class="form-group">
                            <label class="text-black" for="email">Email</label>
                                <input type="email" class="form-control" id="email" name="email">
                        </div>

                        <div class="form-group">
                            <label class="text-black" for="uname">User Name</label>
                                <input type="text" class="form-control" id="uname" name="uname">

                        <div class="form-group">
                            <label class="text-black" for="pwd">Password</label>
                                <input type="password" class="form-control" id="pwd" name="pass1">
                        </div>
                        
                        <div class="form-group">
                            <label class="text-black" for="pwd">Confirm Password</label>
                                <input type="password" class="form-control" id="pwd" name="pass2">
                        </div>
                        <br><center>
                            <button type="submit" class="btn btn-primary py-2 px-4">Register</button>
                        </center>

                    </form>

                    <h5>Already Registered?, <a href="/login/">Login</a></h5>
                    </div>

            </div>
        



    

{% endblock body %}
