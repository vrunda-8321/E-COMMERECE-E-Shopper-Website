<!DOCTYPE html>
<html lang='en'>
    <head>
        <meta charset='UTF-8'>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Add</title>
    </head>
    <body>
        <h2>All products</h2>
        <a href="{% url 'add_product' %}">Add new Product</a>

        <table border='1'>
            <tr>
                <th>Image</th>
                <th>Name</th>
                <th>price</th>
                <th>Category</th>
                <th>actions</th>

            </tr>
            
            {% for p in products %}
            <tr>
                <td><img src="{{ p.pimage }}" width='70'></td>
                <td>{{ p.pname }}</td>
                <td>{{ p.pprice }}</td>
                <td>{{ p.cat.cname }}</td>
                <td>
                    <a href="{% url 'edit_product' p.pid %}">Edit</a>
                    <a href="{% url 'delete_product' p.id %}">delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </body>
    </html>
